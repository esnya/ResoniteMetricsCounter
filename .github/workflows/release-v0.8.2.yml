name: Release v0.8.2

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-v0.8.2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESONITE_INSTALL_DIR: ${{ github.workspace }}/Resonite
      TARGET_SHA: b785c0d79e301dd43d5f986430e00cb9e740663a
      TAG: v0.8.2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare fallback references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESONITE_INSTALL_DIR}/Libraries" "${RESONITE_INSTALL_DIR}/rml_libs"
          curl -fsSL -o "${RESONITE_INSTALL_DIR}/Libraries/ResoniteModLoader.dll" \
            https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll
          curl -fsSL -o "${RESONITE_INSTALL_DIR}/rml_libs/0Harmony.dll" \
            https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/0Harmony.dll

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ./ResoniteMetricsCounter.sln -p:ResonitePath="${RESONITE_INSTALL_DIR}/"
          dotnet build ./ResoniteMetricsCounter.sln -c Release --no-restore -p:ResonitePath="${RESONITE_INSTALL_DIR}/"
          dotnet test ./ResoniteMetricsCounter.sln -c Release --no-build -p:ResonitePath="${RESONITE_INSTALL_DIR}/"

      - name: Create tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" \
            ./ResoniteMetricsCounter/bin/Release/net10.0/ResoniteMetricsCounter.dll \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --generate-notes
